# docs.gurouter.com — static docs (Astro Starlight, built to dist/)
# Deploy: copy to /etc/nginx/sites-enabled/docs.gurouter.com.conf on master,
# then: nginx -t && systemctl reload nginx
# Origin stays HTTP-only: Cloudflare terminates edge TLS (Flexible). No certbot,
# no origin certificate, and no http->https redirect here (a redirect would loop
# behind Cloudflare Flexible SSL).
server {
  listen 80;
  listen [::]:80;
  server_name docs.gurouter.com;
  root /var/www/docs.gurouter.com;

  access_log /var/log/nginx/docs.gurouter.com.access.log main;
  error_log /var/log/nginx/docs.gurouter.com.error.log;

  index index.html;

  # Astro default build.format=directory emits path/index.html
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Pagefind search index: hashed immutable assets, safe to cache long
  location /pagefind/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
